services:

  postgres:
    image: postgres:16
    container_name: transaction_analytics_postgres

    environment:
      POSTGRES_DB: transaction_analytics
      POSTGRES_USER: spark_user
      POSTGRES_PASSWORD: spark_pass

    ports:
      - "5435:5432"

    volumes:
      - transaction_analytics_postgres_data:/var/lib/postgresql/data


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: transaction_analytics_pgadmin

    depends_on:
      postgres:
        condition: service_started

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@transaction.com
      PGADMIN_DEFAULT_PASSWORD: admin_pass
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"

    ports:
      - "5050:80"

    volumes:
      # pgAdmin configuration and saved settings
      - pgadmin_data:/var/lib/pgadmin

      # Project SQL files
      - ../sql:/project_sql:ro

      # Automatically configure PostgreSQL server in pgAdmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro


  spark:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: transaction_analytics_spark

    depends_on:
      postgres:
        condition: service_started

    volumes:
      - ..:/app

    working_dir: /app

    stdin_open: true
    tty: true


volumes:

  transaction_analytics_postgres_data:
    name: transaction_analytics_postgres_data

  pgadmin_data:
    name: transaction_analytics_pgadmin_data